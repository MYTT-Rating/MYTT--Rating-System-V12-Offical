name: Remove duplicate home rank startup sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rank-startup-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove duplicate startup sync and bump app cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = "if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',syncHomeRankBadges,{once:true})}else{syncHomeRankBadges()}\n"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one rank startup sync, found {s.count(old)}')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'app.js?v=20260824-mobile-perf-v1'
          new = 'app.js?v=20260824-rank-startup-cleanup-1'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one app cache key, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js index.html
      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Remove duplicate home rank startup sync"
          git push origin HEAD:main
