name: Apply MYTT Mobile Performance V2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'PERFORMANCE_V2_TRIGGER.txt'
      - '.github/scripts/mobile_performance_v2.py'
      - '.github/workflows/mobile-performance-v2-pr.yml'
      - 'index.html'
      - 'app.js'
      - 'mobile-polish-v23.js'
      - 'marketplace-loader-v2.js'

permissions:
  contents: write

jobs:
  apply-performance-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Apply performance patch
        run: python3 .github/scripts/mobile_performance_v2.py

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check rank-system-v27.js
          node --check marketplace-core-v23.js
          node --check marketplace-loader-v2.js
          node --check mobile-polish-v23.js
          git diff --check
          git diff --stat

      - name: Commit optimized site to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No V2 performance changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js mobile-polish-v23.js marketplace-loader-v2.js
          git commit -m "MYTT Mobile Performance V2"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
