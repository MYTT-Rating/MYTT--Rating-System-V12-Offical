name: Apply profile rank badge lazy loading

on:
  push:
    branches:
      - profile-rank-lazy-final
    paths:
      - '.github/workflows/profile-rank-lazy-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profile-rank-lazy-final
      - name: Add lazy loading to profile rank badges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = '<img class="profile-rank-detail-badge" src="${rankBadgeUrl(t)}" alt="" aria-hidden="true">'
          new = '<img class="profile-rank-detail-badge" src="${rankBadgeUrl(t)}" alt="" aria-hidden="true" loading="lazy" decoding="async" fetchpriority="low">'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one profile rank badge template, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'app.js?v=20260824-rank-startup-cleanup-1'
          new = 'app.js?v=20260824-profile-rank-lazy-1'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one app cache key, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app.js
          git diff --check
          git diff -- app.js index.html
      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Lazy-load profile rank journey badges"
          git push origin HEAD:profile-rank-lazy-final
