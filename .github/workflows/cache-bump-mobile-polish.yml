name: Refresh mobile polish cache

on:
  push:
    branches:
      - cache-bump-mobile-polish
    paths:
      - '.github/workflows/cache-bump-mobile-polish.yml'

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cache-bump-mobile-polish
      - name: Update only mobile polish script cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'mobile-polish-v23.js?v=20260824-mobile-perf-v1'
          new = 'mobile-polish-v23.js?v=20260824-avatar-cleanup-1'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one cache key, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html
      - name: Commit cache key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh mobile polish cache key"
          git push origin HEAD:cache-bump-mobile-polish
