name: Apply V21.11 home badge cache bump

on:
  push:
    paths:
      - '.github/workflows/apply-v219-home-badges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump marketplace cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          old_outer = 'marketplace.css?v=20260820-mobile-v21-10'
          new_outer = 'marketplace.css?v=20260820-mobile-v21-11'
          if old_outer not in h:
              raise SystemExit('Expected V21.10 marketplace cache key not found; refusing unsafe patch')
          p.write_text(h.replace(old_outer, new_outer, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Load V21.11 natural home rank badges"
          git push
