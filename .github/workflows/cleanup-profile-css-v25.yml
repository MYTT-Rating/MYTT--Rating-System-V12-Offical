# retry: 2026-08-21 profile CSS consolidation
name: Consolidate Mobile Profile CSS

on:
  push:
    branches:
      - cleanup-profile-css-v25-20260821
    paths:
      - '.github/workflows/cleanup-profile-css-v25.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-profile-css-v25-20260821
          fetch-depth: 0

      - name: Consolidate profile CSS into mobile polish module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          site_path = Path('site-overrides-v24.css')
          polish_path = Path('mobile-polish-v23.css')
          market_loader_path = Path('marketplace.js')
          index_path = Path('index.html')

          site = site_path.read_text(encoding='utf-8')
          polish = polish_path.read_text(encoding='utf-8')
          loader = market_loader_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          marker = 'SOURCE: index.html <style id="mytt-mobile-v20-1-profile-clearance">'
          pos = site.find(marker)
          if pos < 0:
              raise SystemExit('V20.1 profile source block not found')
          start = site.rfind('/* =========================================================', 0, pos)
          if start < 0:
              raise SystemExit('V20.1 source block start not found')
          next_pos = site.find('SOURCE: index.html <style id="', pos + len(marker))
          end = len(site) if next_pos < 0 else site.rfind('/* =========================================================', start + 1, next_pos)
          if end <= start:
              raise SystemExit('Unsafe V20.1 source block boundary')

          old_block = site[start:end]
          for token in ['#profileModal{','#profileModal .modal-card{','#profileModal .modal-close{','#profileContent{','#profileContent .profile-hero-pro{','#profileContent .profile-avatar-pro{']:
              if token not in old_block:
                  raise SystemExit(f'Expected V20.1 token missing: {token}')
          site = site[:start].rstrip() + '\n'

          anchor = '''  /* ---------------------------------------------------------\n     1. Player Profile modal: one scroll surface, no nav overlap\n     --------------------------------------------------------- */\n'''
          if anchor not in polish:
              raise SystemExit('Profile anchor not found in mobile-polish-v23.css')

          migrated = '''  /* ---------------------------------------------------------
     1a. Profile sheet geometry migrated from V20.1
     Keep layout primitives here so all phone-profile CSS lives in one module.
     --------------------------------------------------------- */
  #profileModal{
    right:0 !important;
    bottom:0 !important;
    left:0 !important;
    padding:8px 0 0 !important;
    place-items:start center !important;
    overflow:hidden !important;
  }

  #profileModal .modal-backdrop{inset:0 !important;}

  #profileModal .modal-card{
    width:100% !important;
    max-height:calc(100dvh - var(--mytt-mobile-header,60px) - 8px) !important;
    margin:0 !important;
    padding:0 12px 26px !important;
    border-radius:18px 18px 0 0 !important;
  }

  #profileModal .modal-close{right:auto !important;}
  #profileContent{clear:both !important;padding:18px 8px 30px !important;}
  #profileContent .profile-hero-pro{margin-top:0 !important;}
  #profileContent .profile-avatar-pro{margin-top:2px !important;}

'''
          if 'Profile sheet geometry migrated from V20.1' in polish:
              raise SystemExit('Migration block already exists')
          polish = polish.replace(anchor, migrated + anchor, 1)

          index, n1 = re.subn(r'site-overrides-v24\.css\?v=[^"\']+', 'site-overrides-v24.css?v=20260821-5', index, count=1)
          loader, n2 = re.subn(r'mobile-polish-v23\.css\?v=[^"\']+', 'mobile-polish-v23.css?v=20260821-2', loader, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Cache key update failed: site={n1}, polish={n2}')

          if marker in site:
              raise SystemExit('Old V20.1 profile source block still remains')
          for token in ['Profile sheet geometry migrated from V20.1','#profileModal:not(.hidden)','z-index:5200 !important','top:var(--mytt-mobile-header) !important','height:calc(100dvh - var(--mytt-mobile-header)) !important','padding:0 12px 26px !important','padding:18px 8px 30px !important','.profile-panel-collapsible']:
              if token not in polish:
                  raise SystemExit(f'Final profile token missing: {token}')

          site_path.write_text(site, encoding='utf-8')
          polish_path.write_text(polish, encoding='utf-8')
          market_loader_path.write_text(loader, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check marketplace.js
          node --check mobile-polish-v23.js

      - name: Validate profile CSS ownership
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'mytt-mobile-v20-1-profile-clearance' site-overrides-v24.css
          grep -q 'Profile sheet geometry migrated from V20.1' mobile-polish-v23.css
          grep -q 'mobile-polish-v23.css?v=20260821-2' marketplace.js
          grep -q 'site-overrides-v24.css?v=20260821-5' index.html

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add -- site-overrides-v24.css mobile-polish-v23.css marketplace.js index.html
          git commit -m "Consolidate mobile profile CSS"
          git push origin HEAD:cleanup-profile-css-v25-20260821
