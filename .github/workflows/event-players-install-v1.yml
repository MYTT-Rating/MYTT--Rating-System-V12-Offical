name: MYTT event registered players install v1

on:
  push:
    paths:
      - '.github/workflows/event-players-install-v1.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install event players feature
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="event-players-v1.css?v=20260829-event-players-v1">\n'
          if css.strip() not in s:
              marker='<link id="mytt-mobile-polish-v23-style"'
              i=s.find(marker)
              if i<0: raise SystemExit('CSS marker not found')
              s=s[:i]+css+s[i:]
          js='<script defer src="event-players-v1.js?v=20260829-event-players-v1"></script>\n'
          if js.strip() not in s:
              marker='<script defer src="app.js?v=20260824-profile-rank-lazy-1"></script>'
              i=s.find(marker)
              if i<0: raise SystemExit('JS marker not found')
              end=s.find('\n',i)
              s=s[:end+1]+js+s[end+1:]
          p.write_text(s,encoding='utf-8')

          g=Path('MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs'); t=g.read_text(encoding='utf-8')
          old='''    if (action === "events") {\n      payload = {\n        source: "MYTT_EVENTS_WEB_APP",\n        status: "ok",\n        events: getUpcomingEvents()\n      };\n\n    } else if (action === "status") {'''
          new='''    if (action === "events") {\n      payload = {\n        source: "MYTT_EVENTS_WEB_APP",\n        status: "ok",\n        events: getUpcomingEvents()\n      };\n\n    } else if (action === "registrations") {\n      payload = getPublicEventRegistrations(\n        cleanEventText(params.eventId)\n      );\n\n    } else if (action === "status") {'''
          if 'getPublicEventRegistrations(' not in t:
              if old not in t: raise SystemExit('doGet marker not found')
              t=t.replace(old,new,1)
              marker='\n\n/***********************\n * UPCOMING EVENTS DATA\n ***********************/'
              helper='''\n\n/***********************\n * PUBLIC REGISTRATION LIST\n ***********************/\nfunction getPublicEventRegistrations(eventId) {\n  if (!eventId) {\n    return { source: "MYTT_EVENTS_WEB_APP", status: "error", message: "Event ID is required." };\n  }\n\n  const ss = SpreadsheetApp.openById(EVENTS_SPREADSHEET_ID);\n  const sheet = ss.getSheetByName(EVENTS_SHEETS.REGISTRATIONS);\n  if (!sheet) throw new Error("Cannot find sheet: Event Registrations");\n\n  const lastRow = sheet.getLastRow();\n  if (lastRow < 2) {\n    return { source: "MYTT_EVENTS_WEB_APP", status: "ok", eventId: eventId, registrations: [] };\n  }\n\n  const rows = sheet.getRange(2, 1, lastRow - 1, 11).getValues();\n  const target = normalizeEventKey(eventId);\n  const activeStatuses = { confirmed: true, approved: true, accepted: true };\n  const registrations = [];\n\n  rows.forEach(function(row) {\n    if (normalizeEventKey(row[1]) !== target) return;\n    const status = cleanEventText(row[9]).toLowerCase();\n    if (!activeStatuses[status]) return;\n    registrations.push({\n      playerName: cleanEventText(row[3]),\n      myttId: cleanEventText(row[4]),\n      category: cleanEventText(row[5])\n    });\n  });\n\n  return {\n    source: "MYTT_EVENTS_WEB_APP",\n    status: "ok",\n    eventId: eventId,\n    registrations: registrations\n  };\n}\n'''
              if marker not in t: raise SystemExit('helper marker not found')
              t=t.replace(marker,helper+marker,1)
          g.write_text(t,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'event-players-v1.js' index.html
          grep -q 'event-players-v1.css' index.html
          grep -q 'action === "registrations"' MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
          grep -q 'function getPublicEventRegistrations' MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
          git commit -m 'Add registered players view to events' || exit 0
          git push