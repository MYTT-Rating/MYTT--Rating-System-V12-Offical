name: Sync Profile Rank Journey

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync rank logic and badge mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Rating logic: make the profile journey match the 9-step Home journey.
          app = Path('app.js')
          js = app.read_text(encoding='utf-8')
          new_tiers = '''const TIERS=[{min:-Infinity,name:"Novice",icon:"🌿",cls:"tier-novice",badge:"novice",next:1500},{min:1500,name:"Rookie",icon:"🌱",cls:"tier-rookie",badge:"novice",next:1600},{min:1600,name:"Challenger",icon:"⚔️",cls:"tier-challenger",badge:"rookie",next:1700},{min:1700,name:"Elite",icon:"⭐",cls:"tier-elite",badge:"challenger",next:1800},{min:1800,name:"Master",icon:"🔥",cls:"tier-master",badge:"elite",next:1900},{min:1900,name:"Legend",icon:"👑",cls:"tier-legend",badge:"expert",next:2000},{min:2000,name:"Grandmaster",icon:"💎",cls:"tier-grandmaster",badge:"master",next:2100},{min:2100,name:"Immortal",icon:"⚡",cls:"tier-immortal",badge:"grandmaster",next:2200},{min:2200,name:"MYTT Champion",icon:"🏆",cls:"tier-champion",badge:"immortal",next:2300},{min:2300,name:"Hall of Fame",icon:"🌟",cls:"tier-hof",badge:"champion",next:null}];'''
          js, count = re.subn(r'const TIERS=\[.*?\];', new_tiers, js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('TIERS block not found exactly once; refusing unsafe edit')

          js = re.sub(
              r'function leaderboardTierIconHTML\(r\)\{.*?\}\nfunction progressHTML',
              '''function leaderboardTierIconHTML(r){const t=getTier(r);const badge=t.badge==="champion"?"v22-hall-of-fame-mytt-final.webp":`v22-${t.badge}.webp`;return `<img class="leaderboard-mobile-tier ${t.cls}" src="rank-badges/${badge}" alt="" aria-hidden="true" title="${t.name}" loading="lazy">`}\nfunction progressHTML''',
              js,
              count=1,
              flags=re.S
          )
          js = js.replace('You have reached MYTT Champion tier.', 'You have reached ${t.name} tier.')
          app.write_text(js, encoding='utf-8')

          # 2) Profile + mobile leaderboard badge mapping: exactly mirror Home's approved 9 badges.
          rank_css = Path('rank-badges-v22.css')
          css = rank_css.read_text(encoding='utf-8')
          css = re.sub(r'/\* PROFILE RANK SYNC V1 START \*/.*?/\* PROFILE RANK SYNC V1 END \*/\s*', '', css, flags=re.S)
          css += r'''

/* PROFILE RANK SYNC V1 START */
/* Keep every displayed score paired with the same approved badge used on Home. */
.profile-rank-detail-node:nth-child(1) > span{background-image:var(--v22-novice) !important;}
.profile-rank-detail-node:nth-child(2) > span{background-image:var(--v22-rookie) !important;}
.profile-rank-detail-node:nth-child(3) > span{background-image:var(--v22-challenger) !important;}
.profile-rank-detail-node:nth-child(4) > span{background-image:var(--v22-elite) !important;}
.profile-rank-detail-node:nth-child(5) > span{background-image:var(--v22-expert) !important;}
.profile-rank-detail-node:nth-child(6) > span{background-image:var(--v22-master) !important;}
.profile-rank-detail-node:nth-child(7) > span{background-image:var(--v22-grandmaster) !important;}
.profile-rank-detail-node:nth-child(8) > span{background-image:var(--v22-immortal) !important;}
.profile-rank-detail-node:nth-child(9) > span{background-image:var(--v22-champion) !important;}

body .tier-pill.tier-novice::before{background-image:var(--v22-novice) !important;}
body .tier-pill.tier-rookie::before{background-image:var(--v22-novice) !important;}
body .tier-pill.tier-challenger::before{background-image:var(--v22-rookie) !important;}
body .tier-pill.tier-elite::before{background-image:var(--v22-challenger) !important;}
body .tier-pill.tier-master::before{background-image:var(--v22-elite) !important;}
body .tier-pill.tier-legend::before{background-image:var(--v22-expert) !important;}
body .tier-pill.tier-grandmaster::before{background-image:var(--v22-master) !important;}
body .tier-pill.tier-immortal::before{background-image:var(--v22-grandmaster) !important;}
body .tier-pill.tier-champion::before{background-image:var(--v22-immortal) !important;}
body .tier-pill.tier-hof::before{background-image:var(--v22-champion) !important;}

@media(max-width:768px){
  html body #singles .leaderboard-mobile-tier.tier-novice,
  html body #doubles .leaderboard-mobile-tier.tier-novice,
  html body #singles .leaderboard-mobile-tier.tier-rookie,
  html body #doubles .leaderboard-mobile-tier.tier-rookie{background-image:var(--v22-novice) !important;}
  html body #singles .leaderboard-mobile-tier.tier-challenger,
  html body #doubles .leaderboard-mobile-tier.tier-challenger{background-image:var(--v22-rookie) !important;}
  html body #singles .leaderboard-mobile-tier.tier-elite,
  html body #doubles .leaderboard-mobile-tier.tier-elite{background-image:var(--v22-challenger) !important;}
  html body #singles .leaderboard-mobile-tier.tier-master,
  html body #doubles .leaderboard-mobile-tier.tier-master{background-image:var(--v22-elite) !important;}
  html body #singles .leaderboard-mobile-tier.tier-legend,
  html body #doubles .leaderboard-mobile-tier.tier-legend{background-image:var(--v22-expert) !important;}
  html body #singles .leaderboard-mobile-tier.tier-grandmaster,
  html body #doubles .leaderboard-mobile-tier.tier-grandmaster{background-image:var(--v22-master) !important;}
  html body #singles .leaderboard-mobile-tier.tier-immortal,
  html body #doubles .leaderboard-mobile-tier.tier-immortal{background-image:var(--v22-grandmaster) !important;}
  html body #singles .leaderboard-mobile-tier.tier-champion,
  html body #doubles .leaderboard-mobile-tier.tier-champion{background-image:var(--v22-immortal) !important;}
  html body #singles .leaderboard-mobile-tier.tier-hof,
  html body #doubles .leaderboard-mobile-tier.tier-hof{background-image:var(--v22-champion) !important;}
}

#profileContent:has(.tier-pill.tier-novice) .tier-progress-top > span:first-child::before{background-image:var(--v22-novice) !important;}
#profileContent:has(.tier-pill.tier-rookie) .tier-progress-top > span:first-child::before{background-image:var(--v22-novice) !important;}
#profileContent:has(.tier-pill.tier-challenger) .tier-progress-top > span:first-child::before{background-image:var(--v22-rookie) !important;}
#profileContent:has(.tier-pill.tier-elite) .tier-progress-top > span:first-child::before{background-image:var(--v22-challenger) !important;}
#profileContent:has(.tier-pill.tier-master) .tier-progress-top > span:first-child::before{background-image:var(--v22-elite) !important;}
#profileContent:has(.tier-pill.tier-legend) .tier-progress-top > span:first-child::before{background-image:var(--v22-expert) !important;}
#profileContent:has(.tier-pill.tier-grandmaster) .tier-progress-top > span:first-child::before{background-image:var(--v22-master) !important;}
#profileContent:has(.tier-pill.tier-immortal) .tier-progress-top > span:first-child::before{background-image:var(--v22-grandmaster) !important;}
#profileContent:has(.tier-pill.tier-champion) .tier-progress-top > span:first-child::before{background-image:var(--v22-immortal) !important;}
#profileContent:has(.tier-pill.tier-hof) .tier-progress-top > span:first-child::before{background-image:var(--v22-champion) !important;}

#profileContent:has(.tier-pill.tier-novice) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-novice) !important;}
#profileContent:has(.tier-pill.tier-rookie) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-rookie) !important;}
#profileContent:has(.tier-pill.tier-challenger) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-challenger) !important;}
#profileContent:has(.tier-pill.tier-elite) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-elite) !important;}
#profileContent:has(.tier-pill.tier-master) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-expert) !important;}
#profileContent:has(.tier-pill.tier-legend) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-master) !important;}
#profileContent:has(.tier-pill.tier-grandmaster) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-grandmaster) !important;}
#profileContent:has(.tier-pill.tier-immortal) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-immortal) !important;}
#profileContent:has(.tier-pill.tier-champion) .tier-progress-top > span:nth-child(2)::before{background-image:var(--v22-champion) !important;}

#profileContent:has(.tier-pill.tier-hof) .profile-rank-compact-head h3::before{
  content:"";display:inline-block;width:34px;height:34px;margin-right:8px;vertical-align:middle;
  background-image:var(--v22-champion) !important;background-repeat:no-repeat;background-position:center;background-size:contain;
}
/* PROFILE RANK SYNC V1 END */
'''
          rank_css.write_text(css, encoding='utf-8')

          # 3) Player list cards: use the same score-to-badge mapping.
          pc = Path('player-card-rank-badges-v1.css')
          pcs = pc.read_text(encoding='utf-8')
          pcs = re.sub(r'/\* PLAYER CARD RANK SYNC V1 START \*/.*?/\* PLAYER CARD RANK SYNC V1 END \*/\s*', '', pcs, flags=re.S)
          pcs += r'''

/* PLAYER CARD RANK SYNC V1 START */
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Novice"],
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Rookie"]{background-image:url("./rank-badges/v22-novice.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Challenger"]{background-image:url("./rank-badges/v22-rookie.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Elite"]{background-image:url("./rank-badges/v22-challenger.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Master"]{background-image:url("./rank-badges/v22-elite.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Legend"]{background-image:url("./rank-badges/v22-expert.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Grandmaster"]{background-image:url("./rank-badges/v22-master.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Immortal"]{background-image:url("./rank-badges/v22-grandmaster.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="MYTT Champion"]{background-image:url("./rank-badges/v22-immortal.webp") !important;}
.player-card.player-card-icon-tier > .player-card-rank-icon[data-tier-icon="Hall of Fame"]{background-image:url("./rank-badges/v22-hall-of-fame-mytt-final.webp?v=20260820-rank-sync-1") !important;}
/* PLAYER CARD RANK SYNC V1 END */
'''
          pc.write_text(pcs, encoding='utf-8')

          # 4) Cache-bust the updated assets so phones do not keep the old mapping.
          market = Path('marketplace.css')
          m = market.read_text(encoding='utf-8')
          m = re.sub(r'rank-badges-v22\.css\?v=[^"\)]+', 'rank-badges-v22.css?v=20260820-rank-sync-1', m)
          market.write_text(m, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = re.sub(r'app\.js\?v=[^"]+', 'app.js?v=20260820-rank-sync-1', h)
          h = re.sub(r'marketplace\.css\?v=[^"]+', 'marketplace.css?v=20260820-rank-sync-1', h)
          h = re.sub(r'player-card-rank-badges-v1\.css\?v=[^"]+', 'player-card-rank-badges-v1.css?v=20260820-rank-sync-1', h)
          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit rank journey sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add app.js rank-badges-v22.css player-card-rank-badges-v1.css marketplace.css index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync 9-step rank journey and badges"
          git push

# trigger-profile-rank-sync-1
