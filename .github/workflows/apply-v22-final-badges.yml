name: Load player card image badges

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Players-page badge stylesheet only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          marker = 'player-card-rank-badges-v1.css'
          anchor = '  <link rel="stylesheet" href="marketplace.css?v=20260820-mobile-v22-8">'
          line = '  <link rel="stylesheet" href="player-card-rank-badges-v1.css?v=20260820-player-card-1">'

          if marker not in h:
              if anchor not in h:
                  raise SystemExit('Expected stylesheet anchor not found; refusing unsafe edit')
              h = h.replace(anchor, anchor + '\n' + line, 1)

          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit Players-page badge loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use image badges on player cards"
          git push
