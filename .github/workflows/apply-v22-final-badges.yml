name: Match Hall of Fame badge visual size

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enlarge only the 2300 badge artwork
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          old = '<div class="home-rank-orb">🌟</div>'
          new = '<div class="home-rank-orb" style="background-size:108%!important;">🌟</div>'

          if old in h:
              h = h.replace(old, new, 1)
          elif 'background-size:108%!important;' not in h:
              raise SystemExit('Hall of Fame orb not found; refusing unsafe edit')

          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit visual-size adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Match Hall of Fame badge size to rank journey"
          git push
