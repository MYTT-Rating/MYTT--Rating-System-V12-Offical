name: Align Hall of Fame badge on mobile

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move only the 2300 badge artwork slightly upward on mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          marker = 'id="mytt-hof-mobile-align-v1"'
          css = '''<style id="mytt-hof-mobile-align-v1">
@media (max-width: 768px){
  .homepage-rank-road .tier-hof-home .home-rank-orb{
    background-position:center calc(50% - 2px) !important;
  }
}
</style>

'''
          anchor = '<style id="mytt-mobile-title-left-fix">'

          if marker not in h:
              if anchor not in h:
                  raise SystemExit('Expected mobile style anchor not found; refusing unsafe edit')
              h = h.replace(anchor, css + anchor, 1)

          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit mobile alignment adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align Hall of Fame badge on mobile"
          git push
