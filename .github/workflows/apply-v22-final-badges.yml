name: Align Hall of Fame artwork on mobile

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align only the Hall of Fame artwork inside its orb
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          # Remove every previous Hall of Fame mobile alignment patch.
          h = re.sub(r'<style id="mytt-hof-mobile-align-v[0-9]+">.*?</style>\s*', '', h, flags=re.S)

          # Keep the rank orb on the same baseline; move only the artwork inside it upward.
          css = '''<style id="mytt-hof-mobile-align-v3">
@media (max-width: 768px){
  .homepage-rank-road .tier-hof-home .home-rank-orb{
    transform:none !important;
    background-position:center calc(50% - 5px) !important;
  }
}
</style>

'''
          anchor = '<style id="mytt-mobile-title-left-fix">'
          if anchor not in h:
              raise SystemExit('Expected mobile style anchor not found; refusing unsafe edit')

          h = h.replace(anchor, css + anchor, 1)
          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit Hall of Fame artwork alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Align Hall of Fame artwork on mobile"
          git push

# trigger-v3
