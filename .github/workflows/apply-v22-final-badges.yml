name: Apply final Hall of Fame cache fix

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force final Hall of Fame asset and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Force the browser to fetch a new outer stylesheet URL.
          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old_outer = 'marketplace.css?v=20260820-mobile-v21-11'
          new_outer = 'marketplace.css?v=20260820-mobile-v22-8'
          if old_outer in h:
              h = h.replace(old_outer, new_outer, 1)
          elif new_outer not in h:
              raise SystemExit('Unexpected marketplace.css cache key in index.html')
          index.write_text(h, encoding='utf-8')

          # 2) Bump the inner V22 imports as well.
          market = Path('marketplace.css')
          m = market.read_text(encoding='utf-8')
          m = m.replace('rank-badges-v22.css?v=20260820-final-v22-7',
                        'rank-badges-v22.css?v=20260820-final-v22-8')
          m = m.replace('rank-badges-v22-img-fix.css?v=20260820-final-v22-7',
                        'rank-badges-v22-img-fix.css?v=20260820-final-v22-8')
          market.write_text(m, encoding='utf-8')

          # 3) Point Hall of Fame directly at the final MYTT gold trophy asset.
          css = Path('rank-badges-v22.css')
          s = css.read_text(encoding='utf-8')
          import re
          s = re.sub(
              r'--v22-champion:url\("[^\"]+"\);',
              '--v22-champion:url("./rank-badges/v22-hall-of-fame-mytt-final.webp?v=20260820-hof-final-mytt-2");',
              s,
              count=1
          )
          final_rule = '''\n\n/* V22.8 FINAL HALL OF FAME — direct asset, no legacy mapping. */\n.homepage-rank-road .tier-hof-home .home-rank-orb{\n  background-image:url("./rank-badges/v22-hall-of-fame-mytt-final.webp?v=20260820-hof-final-mytt-2") !important;\n  background-repeat:no-repeat !important;\n  background-position:center center !important;\n  background-size:contain !important;\n}\n'''
          if 'V22.8 FINAL HALL OF FAME' not in s:
              s += final_rule
          css.write_text(s, encoding='utf-8')
          PY

      - name: Commit cache fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html marketplace.css rank-badges-v22.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Force final Hall of Fame badge and cache refresh"
          git push
