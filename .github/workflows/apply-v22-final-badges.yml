name: Force Hall of Fame image DOM

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render Hall of Fame as a real img element
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          # Force a fresh outer stylesheet URL, but do not rely on CSS for the 2300 badge itself.
          h = h.replace('marketplace.css?v=20260820-mobile-v22-8',
                        'marketplace.css?v=20260820-mobile-v22-9', 1)

          old = '''        <article class="home-rank-node tier-hof-home">
          <div class="home-rank-orb">🌟</div>
          <span>Hall of Fame</span><small>2300</small>
        </article>'''

          new = '''        <article class="home-rank-node tier-hof-home">
          <div class="home-rank-orb home-rank-orb-hof" style="background:none!important;padding:0!important;overflow:visible!important;">
            <img src="rank-badges/v22-hall-of-fame-mytt-final.webp?v=20260820-hof-dom-1" alt="Hall of Fame" width="70" height="70" style="display:block!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:contain!important;object-position:center!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;">
          </div>
          <span>Hall of Fame</span><small>2300</small>
        </article>'''

          if old in h:
              h = h.replace(old, new, 1)
          elif 'v22-hall-of-fame-mytt-final.webp?v=20260820-hof-dom-1' not in h:
              raise SystemExit('Hall of Fame node was not found; refusing unsafe edit')

          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit direct Hall of Fame image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Render Hall of Fame badge as direct image"
          git push
