name: Fine tune Hall of Fame badge on mobile

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move only the 2300 badge slightly upward on mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          # Remove any older Hall of Fame mobile-only inline alignment block.
          h = re.sub(r'<style id="mytt-hof-mobile-align-v[12]">.*?</style>\s*', '', h, flags=re.S)

          css = '''<style id="mytt-hof-mobile-align-v2">
@media (max-width: 768px){
  .homepage-rank-road .tier-hof-home .home-rank-orb{
    transform:translateY(-4px) !important;
  }
}
</style>

'''
          anchor = '<style id="mytt-mobile-title-left-fix">'
          if anchor not in h:
              raise SystemExit('Expected mobile style anchor not found; refusing unsafe edit')

          h = h.replace(anchor, css + anchor, 1)
          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit mobile alignment adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fine tune Hall of Fame mobile alignment"
          git push
