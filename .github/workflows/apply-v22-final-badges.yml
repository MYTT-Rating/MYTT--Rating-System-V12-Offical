name: Finalize MYTT V23 badge set

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh badge CSS and remove legacy Hall of Fame offsets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')

          # Force every browser/phone to fetch the final badge stylesheet chain.
          h = re.sub(
              r'marketplace\.css\?v=[^\"\']+',
              'marketplace.css?v=20260820-final-set-v23-1',
              h,
              count=1
          )

          # Remove the temporary 2300-only optical enlargement.
          h = h.replace(
              '<div class="home-rank-orb" style="background-size:108%!important;">🌟</div>',
              '<div class="home-rank-orb">🌟</div>'
          )

          # Remove the temporary mobile -2px Hall of Fame adjustment if it was installed.
          h = re.sub(
              r'<style id="mytt-hof-mobile-align-v1">.*?</style>\s*',
              '',
              h,
              flags=re.S
          )

          index.write_text(h, encoding='utf-8')
          PY

      - name: Commit final badge integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Activate final approved MYTT badge set"
          git push
