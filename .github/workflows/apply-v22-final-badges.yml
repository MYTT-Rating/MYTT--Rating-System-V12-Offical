name: Recent matches profile controls

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add recent matches expand and collapse behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          js = app.read_text(encoding='utf-8')

          pattern = re.compile(r'function recentMatchesHTML\(name\)\{.*?\}\nfunction ratingHistoryHTML\(name\)', re.S)
          replacement = '''function recentMatchesHTML(name){
  const matches=playerMatches(name).slice().reverse().slice(0,20);
  const visibleCount=5;
  if(!matches.length)return`<div class="profile-panel recent-matches-panel"><h3>🕒 Recent Matches</h3><p class="muted">No match history yet.</p></div>`;

  const cards=matches.map((m,index)=>{
    const win=isWin(m,name),opp=opponentOf(m,name),ba=beforeAfter(m,name),delta=deltaOf(m,name);
    const deltaText=delta===null?"—":(delta>0?"+"+delta:String(delta));
    const deltaCls=delta===null?"":(delta>=0?"match-delta-up":"match-delta-down");
    const extra=index>=visibleCount;
    return`<div class="match-card ${win?"match-win":"match-loss"} ${extra?"recent-match-extra":""}" ${extra?"hidden":""}><div class="match-left">${opponentAvatarHTML(opp)}</div><div class="match-body"><div class="match-result">${win?"🟢 Win":"🔴 Loss"}</div><div class="match-main">vs <span data-player="${encodeURIComponent(opp)}" class="match-opponent">${opp}</span></div><div class="match-score">🏓 ${m.score||"-"}</div><div class="match-rating"><span class="${deltaCls}">${deltaText} Rating</span>${ba.before&&ba.after?` · ${ba.before} → ${ba.after}`:""}</div><div class="match-date">${displayDate(m.matchDate||m.timestamp)}</div></div></div>`;
  }).join("");

  const moreCount=Math.max(0,matches.length-visibleCount);
  const toggle=moreCount?`<button type="button" class="recent-match-toggle" data-expanded="false" data-more="${moreCount}" onclick="toggleRecentMatches(this)">View ${moreCount} More <span aria-hidden="true">⌄</span></button>`:"";

  return`<div class="profile-panel recent-matches-panel"><h3>🕒 Recent Matches</h3><div class="match-list">${cards}</div>${toggle}</div>`;
}

function toggleRecentMatches(button){
  const panel=button.closest(".recent-matches-panel");
  if(!panel)return;
  const extras=[...panel.querySelectorAll(".recent-match-extra")];
  const expanded=button.dataset.expanded==="true";
  extras.forEach(card=>{card.hidden=expanded;});
  button.dataset.expanded=expanded?"false":"true";
  const more=Number(button.dataset.more||extras.length);
  button.innerHTML=expanded?`View ${more} More <span aria-hidden="true">⌄</span>`:`Show Less <span aria-hidden="true">⌃</span>`;
}
function ratingHistoryHTML(name)'''

          new_js, count = pattern.subn(lambda m: replacement, js, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one recentMatchesHTML block, found {count}')
          app.write_text(new_js, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'<style id="mytt-recent-matches-toggle-v1">.*?</style>\s*', '', html, flags=re.S)

          css = '''<style id="mytt-recent-matches-toggle-v1">
.recent-match-extra[hidden]{display:none !important;}
.recent-match-toggle{
  width:100%;
  min-height:44px;
  margin:12px 0 0;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid rgba(239,68,68,.42);
  border-radius:12px;
  background:rgba(255,255,255,.055);
  color:#fff;
  font:inherit;
  font-size:13px;
  font-weight:900;
  letter-spacing:.2px;
  cursor:pointer;
  transition:.16s ease;
}
.recent-match-toggle:hover{background:rgba(239,68,68,.13);border-color:rgba(239,68,68,.62);}
.recent-match-toggle span{font-size:16px;line-height:1;color:#ff6666;}
@media(max-width:768px){
  .recent-match-toggle{min-height:42px;margin-top:10px;font-size:12px;border-radius:11px;}
}
</style>

'''
          if '</head>' not in html:
              raise SystemExit('Missing </head> in index.html')
          html = html.replace('</head>', css + '</head>', 1)
          html = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260820-recent-matches-20-1', html, count=1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit recent matches controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add recent matches 5-to-20 toggle"
          git push

# trigger-recent-matches-1
