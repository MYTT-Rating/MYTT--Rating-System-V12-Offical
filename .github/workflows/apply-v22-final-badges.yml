name: Roll back unstable V23 badge rollout

on:
  push:
    paths:
      - '.github/workflows/apply-v22-final-badges.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last stable badge version
        shell: bash
        run: |
          set -euo pipefail
          STABLE=dfc81b1801981994cd0ef79274ffab4cad57584f

          git show "$STABLE:index.html" > index.html
          git show "$STABLE:marketplace.css" > marketplace.css
          git show "$STABLE:.github/workflows/apply-v22-final-badges.yml" > .github/workflows/apply-v22-final-badges.yml

          rm -f rank-badges-final-v23.css
          rm -f rank-badges/mytt-final-badges-v23.webp

      - name: Commit exact rollback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to roll back"
            exit 0
          fi
          git commit -m "Restore stable pre-V23 badge version"
          git push
