name: Apply MYTT Mobile Performance V1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-performance-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply performance patch
        run: python3 .github/scripts/mobile_performance_v1.py

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check rank-system-v27.js
          node --check marketplace-core-v23.js
          node --check mobile-polish-v23.js
          git diff --check

      - name: Commit optimized site to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No performance changes required."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html marketplace.css app.js rank-system-v27.js
          git commit -m "MYTT Mobile Performance V1"
          git push origin HEAD:${{ github.head_ref }}
