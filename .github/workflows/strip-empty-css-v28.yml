name: Strip Empty CSS V28

on:
  push:
    branches: [main]
    paths: ['.github/workflows/strip-empty-css-v28.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-cleanup-v28-20260821
          fetch-depth: 0
      - name: Remove empty selector shells
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('site-overrides-v24.css')
          s=p.read_text(encoding='utf-8')
          before=s
          pattern=re.compile(r'(?ms)^[ \t]*([.#][^{}\n]+)\{[ \t\r\n]*\}[ \t]*\n?')
          total=0
          while True:
              s,n=pattern.subn('',s)
              total+=n
              if not n: break
          s=re.sub(r'\n{4,}','\n\n\n',s)
          if not total:
              raise SystemExit('No empty CSS rules found')
          p.write_text(s,encoding='utf-8')
          print(f'Removed {total} empty selector rules')
          PY
          node --check app.js
          node --check marketplace.js
          node --check marketplace-core-v23.js
          node --check mobile-polish-v23.js
          ! grep -Eq '^[[:space:]]*[.#][^{}]*\{[[:space:]]*\}[[:space:]]*$' site-overrides-v24.css
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add site-overrides-v24.css
          git commit -m "Remove empty CSS selector shells"
          git push origin HEAD:final-cleanup-v28-20260821
