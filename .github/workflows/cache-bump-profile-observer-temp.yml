name: Refresh profile observer cache

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cache-bump-profile-observer-temp.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update mobile polish cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'mobile-polish-v23.js?v=20260824-avatar-cleanup-1'
          new = 'mobile-polish-v23.js?v=20260824-profile-observer-1'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old cache key, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html
      - name: Commit cache key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh profile observer cache key"
          git push origin HEAD:main
