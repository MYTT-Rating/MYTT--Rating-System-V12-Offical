name: MYTT mobile stability cleanup v1

on:
  push:
    paths:
      - '.github/workflows/mobile-stability-cleanup-v1.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe mobile and data-loading cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          marker = '<script defer src="app.js?v=20260824-profile-rank-lazy-1"></script>'
          resilience = '<script src="data-resilience-v1.js?v=20260829-mobile-stability-v1"></script>\n'
          if resilience.strip() not in s:
              if marker not in s:
                  raise SystemExit('app.js marker not found; refusing index change')
              s = s.replace(marker, resilience + marker, 1)

          # Remove the obsolete phone hamburger from the HTML entirely.
          old_toggle = '''    <button class="premium-mobile-toggle" type="button" aria-label="Open navigation" aria-expanded="false">\n      <span></span><span></span><span></span>\n    </button>\n'''
          if old_toggle in s:
              s = s.replace(old_toggle, '', 1)

          index.write_text(s, encoding='utf-8')

          css = Path('mobile-polish-v23.css')
          c = css.read_text(encoding='utf-8')
          block = '''\n/* MYTT mobile navigation cleanup — bottom navigation is the single phone nav. */\n@media (max-width:860px){\n  .premium-mobile-toggle,\n  .premium-nav{\n    display:none !important;\n  }\n\n  .premium-header-inner{\n    justify-content:flex-start !important;\n  }\n\n  .premium-brand{\n    margin-right:auto !important;\n  }\n}\n'''
          if 'MYTT mobile navigation cleanup — bottom navigation is the single phone nav.' not in c:
              c = c.rstrip() + '\n' + block
          css.write_text(c, encoding='utf-8')
          PY

      - name: Validate targeted changes
        run: |
          grep -q 'data-resilience-v1.js?v=20260829-mobile-stability-v1' index.html
          ! grep -q '<button class="premium-mobile-toggle"' index.html
          grep -q 'bottom navigation is the single phone nav' mobile-polish-v23.css

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile-polish-v23.css
          git commit -m 'Improve mobile navigation and data resilience' || exit 0
          git push
