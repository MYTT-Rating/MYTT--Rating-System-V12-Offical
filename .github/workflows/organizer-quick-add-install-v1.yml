name: MYTT organizer quick add install v1

on:
  push:
    paths:
      - '.github/workflows/organizer-quick-add-install-v1.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install organizer quick add
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs')
          s=p.read_text(encoding='utf-8')

          if 'function buildOrganizerAdminPage()' in s:
              raise SystemExit(0)

          old='''  const action =\n    cleanEventText(\n      params.action\n    );\n\n  const callback ='''
          new='''  const action =\n    cleanEventText(\n      params.action\n    );\n\n  if (action === "admin") {\n    return buildOrganizerAdminPage();\n  }\n\n  const callback ='''
          if old not in s:
              raise SystemExit('doGet action marker not found')
          s=s.replace(old,new,1)

          marker='''\n\n/***********************\n * PUBLIC REGISTRATION LIST\n ***********************/'''
          if marker not in s:
              raise SystemExit('public registration marker not found')

          block=r'''

/***********************
 * ORGANIZER QUICK ADD
 ***********************/

function verifyOrganizerAdminKey(adminKey) {
  const configured = cleanEventText(
    PropertiesService.getScriptProperties().getProperty("MYTT_ADMIN_KEY")
  );

  if (!configured) {
    throw new Error("Organizer access has not been configured yet.");
  }

  if (cleanEventText(adminKey) !== configured) {
    throw new Error("Invalid organizer key.");
  }
}

function getOrganizerEvents(adminKey) {
  verifyOrganizerAdminKey(adminKey);
  return getUpcomingEvents();
}

function organizerBulkAdd(adminKey, eventId, category, namesText) {
  verifyOrganizerAdminKey(adminKey);

  const cleanEventId = cleanEventText(eventId);
  const cleanCategory = cleanEventText(category) || "Singles";
  const rawText = String(namesText || "");

  if (!cleanEventId) throw new Error("Please select an event.");
  if (!rawText.trim()) throw new Error("Paste at least one player name.");

  const parsed = [];
  const seenInput = {};

  rawText.split(/\r?\n/).forEach(function(line) {
    let item = cleanEventText(line)
      .replace(/^\s*(?:[-•*]|\d+[.)-])\s*/, "")
      .trim();

    if (!item) return;

    let playerName = item;
    let myttId = "";
    const pipe = item.lastIndexOf("|");
    if (pipe > 0) {
      playerName = cleanEventText(item.slice(0, pipe));
      myttId = cleanEventText(item.slice(pipe + 1));
    }

    if (!playerName) return;
    const key = normalizeEventKey(myttId || playerName);
    if (seenInput[key]) return;
    seenInput[key] = true;

    parsed.push({ playerName: playerName, myttId: myttId });
  });

  if (!parsed.length) throw new Error("No valid player names were found.");

  const lock = LockService.getScriptLock();
  lock.waitLock(30000);

  try {
    const ss = SpreadsheetApp.openById(EVENTS_SPREADSHEET_ID);
    const eventsSheet = ss.getSheetByName(EVENTS_SHEETS.EVENTS);
    const registrationsSheet = ss.getSheetByName(EVENTS_SHEETS.REGISTRATIONS);

    if (!eventsSheet) throw new Error("Cannot find sheet: Events");
    if (!registrationsSheet) throw new Error("Cannot find sheet: Event Registrations");

    const event = getEventById(eventsSheet, registrationsSheet, cleanEventId);
    if (!event) throw new Error("This MYTT event could not be found.");

    if (event.effectiveStatus === "Closed" || event.effectiveStatus === "Completed") {
      throw new Error("This event is closed.");
    }

    const activeStatuses = { confirmed: true, approved: true, accepted: true };
    const existingNames = {};
    const existingIds = {};
    const lastRow = registrationsSheet.getLastRow();

    if (lastRow >= 2) {
      registrationsSheet.getRange(2, 1, lastRow - 1, 11).getValues().forEach(function(row) {
        if (normalizeEventKey(row[1]) !== normalizeEventKey(cleanEventId)) return;
        const status = cleanEventText(row[9]).toLowerCase();
        if (!activeStatuses[status]) return;

        const name = normalizeEventKey(row[3]);
        const id = normalizeEventKey(row[4]);
        if (name) existingNames[name] = true;
        if (id) existingIds[id] = true;
      });
    }

    let available = Math.max(0, Number(event.capacity || 0) - Number(event.spotsFilled || 0));
    const added = [];
    const skipped = [];
    const full = [];

    parsed.forEach(function(player) {
      const nameKey = normalizeEventKey(player.playerName);
      const idKey = normalizeEventKey(player.myttId);

      if (existingNames[nameKey] || (idKey && existingIds[idKey])) {
        skipped.push(player.playerName);
        return;
      }

      if (available <= 0) {
        full.push(player.playerName);
        return;
      }

      registrationsSheet.appendRow([
        new Date(),
        event.eventId,
        event.eventName,
        player.playerName,
        player.myttId,
        cleanCategory,
        "",
        "",
        "Organizer Quick Add",
        "Confirmed",
        "ADMIN-" + Utilities.getUuid()
      ]);

      existingNames[nameKey] = true;
      if (idKey) existingIds[idKey] = true;
      available -= 1;
      added.push(player.playerName);
    });

    const updated = getEventById(eventsSheet, registrationsSheet, cleanEventId);

    return {
      status: "ok",
      eventId: event.eventId,
      eventName: event.eventName,
      added: added,
      skipped: skipped,
      full: full,
      spotsFilled: updated ? updated.spotsFilled : event.spotsFilled + added.length,
      capacity: event.capacity
    };
  } finally {
    lock.releaseLock();
  }
}

function buildOrganizerAdminPage() {
  const html = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MYTT Organizer Quick Add</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f5f5f5;font-family:Inter,Arial,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:28px 18px 52px}.brand{font-weight:900;font-size:28px;letter-spacing:-.03em}.sub{color:#9ea3ad;margin:5px 0 28px}.card{background:#121418;border:1px solid #252932;border-radius:20px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.28)}label{display:block;margin:14px 0 7px;font-weight:800;font-size:13px;color:#d5d7dc}input,select,textarea,button{width:100%;font:inherit;border-radius:12px}input,select,textarea{background:#0b0d10;color:#fff;border:1px solid #30343d;padding:13px 14px;font-size:16px}textarea{min-height:210px;resize:vertical;line-height:1.5}button{border:0;padding:14px 16px;font-weight:900;cursor:pointer}.primary{background:#e03131;color:#fff;margin-top:14px}.secondary{background:#22262d;color:#fff;margin-top:10px}.muted{font-size:12px;color:#8e949e;line-height:1.5}.status{margin-top:14px;padding:13px;border-radius:12px;background:#0b0d10;display:none;white-space:pre-wrap;line-height:1.45}.status.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding-top:20px}.card{padding:15px}}.count{font-size:13px;color:#b8bdc6;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MYTT Organizer</div>
  <div class="sub">Quick Add players from your group list</div>
  <div class="card">
    <label>Organizer Key</label>
    <input id="key" type="password" autocomplete="current-password" placeholder="Enter organizer key">
    <button class="secondary" id="load">Unlock & Load Events</button>

    <div id="panel" hidden>
      <div class="grid">
        <div>
          <label>Event</label>
          <select id="event"></select>
        </div>
        <div>
          <label>Category</label>
          <select id="category"><option>Singles</option><option>Doubles</option></select>
        </div>
      </div>
      <div class="count" id="count"></div>
      <label>Players</label>
      <textarea id="players" placeholder="1. Yong\n2. Shin\n3. Joe\n\nOptional MYTT ID:\nYong | MYTT0001"></textarea>
      <div class="muted">One player per line. Numbered lists are accepted automatically. You can optionally use Name | MYTT ID.</div>
      <button class="primary" id="add">Add Players</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), status=$('status'), panel=$('panel');
let events=[];
function show(msg,bad){status.textContent=msg;status.className='status show';status.style.border='1px solid '+(bad?'#7b2d2d':'#294c38')}
function key(){return $('key').value.trim()}
function renderEvents(list){events=Array.isArray(list)?list:[];$('event').innerHTML=events.map(e=>'<option value="'+e.eventId+'">'+e.eventName+' — '+e.dateLabel+' ('+e.spotsFilled+'/'+e.capacity+')</option>').join('');panel.hidden=false;sessionStorage.setItem('myttOrganizerKey',key());syncCount();show('Organizer access unlocked.',false)}
function fail(err){show(err&&err.message?err.message:String(err||'Request failed'),true)}
function syncCount(){const e=events.find(x=>x.eventId===$('event').value);$('count').textContent=e?(e.spotsFilled+' / '+e.capacity+' registered'):''}
$('event').addEventListener('change',syncCount);
$('load').onclick=()=>{if(!key())return show('Enter your organizer key first.',true);show('Loading events…',false);google.script.run.withSuccessHandler(renderEvents).withFailureHandler(fail).getOrganizerEvents(key())};
$('add').onclick=()=>{const names=$('players').value;if(!names.trim())return show('Paste at least one player name.',true);$('add').disabled=true;show('Adding players…',false);google.script.run.withSuccessHandler(r=>{const parts=['Added: '+r.added.length];if(r.added.length)parts.push(r.added.join(', '));if(r.skipped.length)parts.push('Already registered: '+r.skipped.join(', '));if(r.full.length)parts.push('Not added — event full: '+r.full.join(', '));parts.push('Now '+r.spotsFilled+' / '+r.capacity+' registered');show(parts.join('\n'),false);$('players').value='';const e=events.find(x=>x.eventId===r.eventId);if(e)e.spotsFilled=r.spotsFilled;renderEvents(events);$('event').value=r.eventId;syncCount();$('add').disabled=false}).withFailureHandler(err=>{$('add').disabled=false;fail(err)}).organizerBulkAdd(key(),$('event').value,$('category').value,names)};
const saved=sessionStorage.getItem('myttOrganizerKey');if(saved){$('key').value=saved}
</script>
</body>
</html>`;

  return HtmlService.createHtmlOutput(html)
    .setTitle("MYTT Organizer Quick Add")
    .addMetaTag("viewport", "width=device-width, initial-scale=1, viewport-fit=cover");
}
'''

          s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'action === "admin"' MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
          grep -q 'function organizerBulkAdd' MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
          grep -q 'function buildOrganizerAdminPage' MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
          grep -q 'MYTT_ADMIN_KEY' MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MYTT_Events_Registration_WebApp_V20_AUTO_CONFIRM.gs
          git commit -m 'Add organizer quick add for event registrations' || exit 0
          git push
