name: Cleanup Legacy Mobile Event

on:
  push:
    branches:
      - cleanup-legacy-mobile-event-20260821
    paths:
      - '.github/workflows/cleanup-legacy-mobile-event.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-legacy-mobile-event-20260821
          fetch-depth: 0

      - name: Remove obsolete mobile Event generations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('site-overrides-v24.css')
          app_path = Path('app.js')
          index_path = Path('index.html')

          css = css_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          remove_ids = [
              'mytt-mobile-event-final-compact-v1',
              'mytt-mobile-event-pro-dom-v2',
              'mytt-mobile-event-hero-only-v3',
              'mytt-event-exact-code-v4',
          ]

          source_prefix = '/* =========================================================\n   SOURCE: index.html <style id="'

          for style_id in remove_ids:
              marker = f'SOURCE: index.html <style id="{style_id}">'
              marker_pos = css.find(marker)
              if marker_pos < 0:
                  raise SystemExit(f'Missing CSS source block: {style_id}')
              block_start = css.rfind('/* =========================================================', 0, marker_pos)
              if block_start < 0:
                  raise SystemExit(f'Unable to locate block start: {style_id}')
              next_source = css.find(source_prefix, marker_pos + len(marker))
              if next_source >= 0:
                  block_end = css.rfind('/* =========================================================', block_start + 1, next_source + 1)
                  if block_end <= block_start:
                      block_end = next_source
              else:
                  block_end = len(css)
              css = css[:block_start].rstrip() + '\n\n' + css[block_end:].lstrip()

          patterns = [
              (r'\n\s*<!-- New mobile-only Event DOM\..*?-->\s*<section class="mobile-event-pro"[\s\S]*?</section>\s*', 'mobile-event-pro'),
              (r'\n\s*<!-- MYTT mobile Event V4:.*?-->\s*<section class="mytt-event-v4"[\s\S]*?</section>\s*', 'mytt-event-v4'),
          ]

          for pattern, label in patterns:
              app, count = re.subn(pattern, '\n', app, count=1)
              if count != 1:
                  fallback = rf'\n\s*<section class="{re.escape(label)}"[\s\S]*?</section>\s*'
                  app, count = re.subn(fallback, '\n', app, count=1)
              if count != 1:
                  raise SystemExit(f'Unable to remove legacy DOM section: {label}')

          required = [
              '<section class="mytt-event-v5"',
              '<section class="target-event-hero"',
              '<section class="target-event-details"',
              'mytt-event-hero-exact-v5',
              'mytt-event-v12-clean-metal-compact',
          ]
          combined = app + '\n' + css
          for token in required:
              if token not in combined:
                  raise SystemExit(f'Active Event token disappeared: {token}')

          if '<section class="mobile-event-pro"' in app:
              raise SystemExit('mobile-event-pro DOM still present')
          if '<section class="mytt-event-v4"' in app:
              raise SystemExit('mytt-event-v4 DOM still present')
          for style_id in remove_ids:
              if f'SOURCE: index.html <style id="{style_id}">' in css:
                  raise SystemExit(f'Legacy CSS block still present: {style_id}')

          css_path.write_text(css.rstrip() + '\n', encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')

          index, n1 = re.subn(r'site-overrides-v24\.css\?v=[^"]+', 'site-overrides-v24.css?v=20260821-2', index, count=1)
          index, n2 = re.subn(r'app\.js\?v=[^"]+', 'app.js?v=20260821-event-cleanup-1', index, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Cache key update failed: site={n1}, app={n2}')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Validate cleanup boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mytt-event-v5' app.js
          grep -q 'target-event-hero' app.js
          ! grep -q '<section class="mobile-event-pro"' app.js
          ! grep -q '<section class="mytt-event-v4"' app.js
          ! grep -q 'SOURCE: index.html <style id="mytt-mobile-event-pro-dom-v2">' site-overrides-v24.css
          ! grep -q 'SOURCE: index.html <style id="mytt-event-exact-code-v4">' site-overrides-v24.css

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MYTT-Rating"
          git config user.email "hangtbabm@gmail.com"
          git add -- app.js index.html site-overrides-v24.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove obsolete mobile Event generations"
          git push origin HEAD:cleanup-legacy-mobile-event-20260821
